<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Title</title>
  <style>
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #sliderContainer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      z-index: 1000;
      display: none;
    }

    #sliderContainer.active {
      display: block;
    }

    #sliderContainer div {
      margin-bottom: 10px;
      color: white;
      font-family: monospace;
      font-size: 12px;
    }

    #sliderContainer label {
      display: inline-block;
      width: 90px;
      white-space: nowrap;
    }

    #sliderContainer input[type="range"] {
      width: 150px;
      vertical-align: middle;
    }

    #sliderContainer button {
      margin-right: 8px;
      font-family: monospace;
      font-size: 12px;
    }

    #sliderContainer input[type="file"] {
      max-width: 200px;
      margin-bottom: 6px;
      font-family: monospace;
      font-size: 12px;
    }

    #sliderContainer span {
      display: inline-block;
      width: 40px;
      text-align: right;
    }
  </style>
</head>
<body>
<script src="lib/p5.min.js"></script>
<script src="lib/lib.js"></script>
<script src="lib/index.js" type="module"></script>
</body>
</html>
